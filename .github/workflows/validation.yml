name: validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned PowerShell validation modules
        shell: powershell
        run: .\tools\Initialize-GSS-Development.ps1
      - name: Parse PowerShell scripts
        shell: powershell
        run: .\tools\Test-GSS-PowerShellSyntax.ps1
      - name: Run PSScriptAnalyzer against reviewed baseline
        shell: powershell
        run: .\tools\Test-GSS-PSScriptAnalyzer.ps1
      - name: Run Pester module tests
        shell: powershell
        run: .\tools\Test-GSS-Pester.ps1
      - name: Run non-Excel logic tests
        shell: powershell
        run: .\tests\Test-GSS-Logic.ps1
      - name: Run analytics logic tests
        shell: powershell
        run: .\tests\Test-GSS-Analytics.ps1
      - name: Run email package and privacy tests
        shell: powershell
        run: .\tests\Test-GSS-EmailPackage.ps1
      - name: Run Drive backup state-machine tests
        shell: powershell
        run: .\tests\Test-GSS-DriveBackup.ps1
      - name: Run historical recovery transaction tests
        shell: powershell
        run: .\tests\Test-GSS-HistoricalRecovery.ps1
      - name: Verify release manifest file hashes
        shell: powershell
        run: .\scripts\Test-GSS-ReleaseIntegrity.ps1 -SkipTagCheck

  cloud-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Linux setup syntax
        run: bash -n ./tools/Setup-GSS-Cloud.sh
      - name: Install pinned Cloud development dependencies
        run: bash ./tools/Setup-GSS-Cloud.sh
      - name: Run portable synthetic development checks
        run: pwsh -NoProfile -File ./tools/Test-GSS-Cloud.ps1
